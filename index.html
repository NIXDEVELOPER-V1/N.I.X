<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>BASE DE DATOS DEPIEP · Acceso</title>
<style>
:root { color-scheme: dark; --page: #060b17; --card: rgba(13, 23, 42, .92); --ink: #e2e8f0; --ink-2: #94a3b8; --muted: #64748b; --accent: #38bdf8; --accent-2: #818cf8; --border: rgba(56, 189, 248, .30); --bad: #f87171; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  background-color: var(--page);
  background-image:
    radial-gradient(800px 500px at 15% 0%, rgba(14, 116, 244, .25), transparent 70%),
    radial-gradient(700px 500px at 100% 100%, rgba(129, 140, 248, .16), transparent 70%),
    linear-gradient(rgba(56, 189, 248, .05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56, 189, 248, .05) 1px, transparent 1px);
  background-size: auto, auto, 32px 32px, 32px 32px;
}
.box { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px 28px 26px; box-shadow: 0 0 40px rgba(56, 189, 248, .12), 0 20px 50px rgba(0, 0, 0, .4); position: relative; text-align: center; }
.box::before { content: ""; position: absolute; left: 24px; right: 24px; top: -1px; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent); }
.logo { width: 64px; height: 64px; filter: drop-shadow(0 0 10px rgba(56, 189, 248, .6)); }
h1 { font-size: 20px; letter-spacing: .14em; margin: 12px 0 2px; font-weight: 800; text-shadow: 0 0 16px rgba(56, 189, 248, .5); }
h1 span { color: var(--accent); }
.sub { color: var(--ink-2); font-size: 13px; margin: 0 0 22px; letter-spacing: .04em; }
label { display: block; text-align: left; font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; }
.field { position: relative; }
input[type=password], input[type=text] { width: 100%; padding: 12px 44px 12px 14px; font: inherit; font-size: 16px; color: var(--ink); background: #0a1324; border: 1px solid var(--border); border-radius: 10px; letter-spacing: .05em; }
input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, .22), 0 0 18px rgba(56, 189, 248, .3); }
.eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--ink-2); cursor: pointer; padding: 6px; border-radius: 6px; }
.eye:hover { color: var(--accent); }
.keep { display: flex; align-items: center; gap: 8px; justify-content: flex-start; margin: 12px 0 18px; font-size: 13px; color: var(--ink-2); text-transform: none; letter-spacing: 0; cursor: pointer; }
.keep input { accent-color: #38bdf8; width: 16px; height: 16px; }
button.go { width: 100%; padding: 12px; font: inherit; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #06101f; background: linear-gradient(90deg, #38bdf8, #818cf8); border: 0; border-radius: 10px; cursor: pointer; box-shadow: 0 0 20px rgba(56, 189, 248, .35); }
button.go:hover { filter: brightness(1.1); }
button.go:disabled { opacity: .6; cursor: progress; }
.msg { min-height: 22px; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
.msg.bad { color: var(--bad); }
.foot { margin-top: 18px; font-size: 11px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
.foot svg { flex: none; }
</style>
</head>

const CLAVE_SESION = "depiep-acceso";

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const $ = id => document.getElementById(id);

async function descifrar(clave) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(clave.normalize("NFC")), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    { name: "PBKDF2", hash: "SHA-256", salt: b64(PAQUETE.sal), iterations: PAQUETE.iter }, base, 512));
  const kEnc = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  const kMac = await crypto.subtle.importKey("raw", bits.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
  const iv = b64(PAQUETE.iv), ct = b64(PAQUETE.datos), tag = b64(PAQUETE.mac);
  const firmado = new Uint8Array(iv.length + ct.length); firmado.set(iv); firmado.set(ct, iv.length);
  if (!await crypto.subtle.verify("HMAC", kMac, tag, firmado)) throw new Error("clave");
  const plano = await crypto.subtle.decrypt({ name: "AES-CBC", iv }, kEnc, ct);
  return new TextDecoder().decode(plano);
}

// Botón "Bloquear" que se añade al panel una vez abierto
const BLOQUEO = `<script>(function(){var t=document.querySelector('.tools');if(!t)return;var b=document.createElement('button');b.className='btn';b.type='button';b.textContent='Bloquear';b.title='Cerrar el acceso en esta pestaña';b.onclick=function(){try{sessionStorage.removeItem('${CLAVE_SESION}')}catch(e){}location.reload()};t.appendChild(b)})();<\/script>`;

async function abrir(clave, guardar) {
  const html = await descifrar(clave);
  if (guardar) { try { sessionStorage.setItem(CLAVE_SESION, clave); } catch (e) {} }
  document.open();
  const fin = html.toLowerCase().lastIndexOf("<\/body>");
  document.write(fin < 0 ? html + BLOQUEO : html.slice(0, fin) + BLOQUEO + html.slice(fin));
  document.close();
}

$("eye").addEventListener("click", () => { const p = $("pw"); p.type = p.type === "password" ? "text" : "password"; p.focus(); });
$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("msg"), go = $("go");
  if (!window.crypto || !crypto.subtle) { msg.className = "msg bad"; msg.textContent = "Este navegador no permite descifrar. Usa Chrome, Edge, Firefox o Safari actualizados."; return; }
  go.disabled = true; msg.className = "msg"; msg.textContent = "Verificando…";
  try { await abrir($("pw").value, $("keep").checked); }
  catch (err) {
    go.disabled = false; msg.className = "msg bad";
    msg.textContent = err.message === "clave" ? "Contraseña incorrecta." : "No se pudo abrir el panel.";
    $("pw").select();
  }
});

// Si ya se abrió en esta pestaña, al refrescar entra directo (con los datos nuevos)
(async () => {
  let c = null; try { c = sessionStorage.getItem(CLAVE_SESION); } catch (e) {}
  if (!c || !window.crypto || !crypto.subtle) return;
  $("msg").textContent = "Abriendo…"; $("go").disabled = true;
  try { await abrir(c, false); }
  catch (e) { try { sessionStorage.removeItem(CLAVE_SESION); } catch (_) {} $("msg").textContent = "El panel se actualizó con otra contraseña. Escríbela de nuevo."; $("go").disabled = false; }
})();
})();
